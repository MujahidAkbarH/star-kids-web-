<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Us - Star Kids Grammar Secondary School</title>
  <style>
 * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Open Sans", sans-serif;
  background-color: #f5f5f5;
  color: #333;
}

/* ABOUT SECTION */
.about {
  background-color: #a18c8c;
  width: 100%;
  height: 180px;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-left: 7rem;
  color: white;
}

.about .heading {
  font-size: 4rem;
  font-weight: 600;
}

.about ul {
  margin-top: 15px;
  display: flex;
  gap: 5px;
  list-style: none;
}

.about ul li a {
  text-decoration: none;
  color: inherit;
  pointer-events: auto;
}

.about ul li a:hover {
  color: #ffcb05;
}

/* SUBNAV SECTION */
.subnav {
  display: flex;
  background-color: #0066b3;
  width: 100%;
  height: 50px;
  align-items: center;
}

/* Align subnav with ABOUT US heading */
.subnav ul {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  list-style: none;
  margin-left: 7rem; /* same as about padding for alignment */
  gap: 80px;
  width: 100%;
}

.subnav ul li a {
  text-decoration: none;
  font-size: 14px;
  font-weight: 400;
  color: #fff;
  transition: color 0.3s ease;
}

.subnav ul li a:hover {
  color: #ffcb05;
}

/* ================== RESPONSIVE DESIGN ================== */

/* Tablets and small laptops */
@media (max-width: 1024px) {
  .about {
    padding-left: 3rem;
  }

  .about .heading {
    font-size: 3rem;
  }

  .subnav ul {
    margin-left: 3rem;
    gap: 50px;
  }
}

/* Mobile devices */
@media (max-width: 768px) {
  .about {
    height: auto;
    padding: 2rem 1rem;
    text-align: center;
    padding-left: 0;
  }

  .about .heading {
    font-size: 2.5rem;
    margin-bottom: 10px;
  }

  .about ul {
    justify-content: center;
    flex-wrap: wrap;
    font-size: 0.9rem;
  }

  .subnav {
    height: auto;
    flex-direction: column;
    padding: 10px 0;
  }

  .subnav ul {
    margin-left: 0;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .subnav ul li a {
    font-size: 16px;
  }
}

/* Very small phones */
@media (max-width: 480px) {
  .about .heading {
    font-size: 2rem;
  }

  .about ul {
    font-size: 0.8rem;
  }

  .subnav ul li a {
    font-size: 14px;
  }
}

  </style>
</head>
<body>

  <!-- aboutsection -->

<div class="about">
  <div class="heading ml-28 mt-10 text-7xl font-sans font-semibold text-white">ABOUT US</div>
  <ul>

    <li class="text-xl font-semibold text-[#ffcb05]"><a href="./about.html" class="no-underline text-[#ffcb05]">ABOUT US</a></li>
  </ul>
</div>


  <div class="subnav">
    <ul>
      <li><a href="./mission.html">.Vission And Mission</a></li>
      <li><a href="./message.html">.Chairperson's Message</a></li>
      <li><a href="./training.html">.Teacher's Training </a></li>
      <li><a href="./glance.html">.Star Kids At Glance</a></li>
    </ul>
  </div>

</body>
</html>
