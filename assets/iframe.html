<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Result Viewer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #f5f5f5;
    }

    h1 {
      margin-top: 20px;
      color: #0066b3;
      text-align: center;
    }

    .iframe-container {
      width: 100%;
      max-width: 1200px; /* adjust as needed */
      height: 80vh; /* adjust height as needed */
      margin: 20px auto;
      border: 2px solid #0066b3;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (max-width: 640px) {
      .iframe-container {
        height: 60vh;
        margin: 10px;
      }
    }
  </style>
</head>
<body>
  <h1>Check Your Result</h1>
  <div class="iframe-container">
    <iframe src="https://skgss-edu.github.io/mid-term-result-2025-26/
" title="Result"></iframe>
  </div>
</body>
</html>
